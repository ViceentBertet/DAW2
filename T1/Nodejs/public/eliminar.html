<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar datos</title>
    <style>
        /* Estilo global */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Contenedor principal */
        .container {
            background-color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h3 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        /* Estilo para el campo de input */
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #4CAF50;
        }

        /* Estilo para el botón */
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            background-color: #388e3c;
        }

        /* Estilo para mensajes */
        .message {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            font-size: 16px;
        }

        .success {
            background-color: #4CAF50;
            color: white;
        }

        .error {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Eliminar Usuario</h3>

        <label for="id1">ID del Usuario:</label>
        <input type="number" id="id1" placeholder="Introduce el ID del usuario" required>

        <button id="boton">Enviar</button>

        <div id="message" class="message"></div>
    </div>

    <script>
        boton.addEventListener("click", function() {
            const id = id1.value;
            
            fetch("/usuario", {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({id})
            })
            .then(response => response.json())
            .then((data) => {
                message.classList.remove('error');
                message.classList.add('success');
                message.innerText = data.mensaje;
            })
            .catch((error) => {
                message.classList.add('error');
                message.classList.remove('success');
                message.innerText = data.mensaje;
            })
        });
    </script>
</body>
</html>
