<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar datos</title>
    <style>
        h3 {
            text-align: center;
            margin:5px;
            padding: 0;
        }
        table {
            margin: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>Insertar usuario</h3>
    <form method="post" action="/usuario">
        <table>
            <tr>
                <td>Nombre:</td>
                <td>Contraseña:</td>
                <td>Email:</td>
            </tr>
            <tr>
                <td>
                    <input type="text" id="nom" name="nom">

                </td>
                <td>
                    <input type="password" name="pwd" id="pwd">
                </td>
                <td>
                    <input type="email" id="email" name="email" >
                </td>
            </tr>
            <tr>
                <td colspan="3">
                    <input type="submit">
                </td>
            </tr>
            
        </table>
    </form>
</body>
</html>
