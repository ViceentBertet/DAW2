<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar datos</title>
    <style>
        /* Estilo global */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Contenedor principal */
        .container {
            background-color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h3 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        /* Estilo para el campo de input */
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: #4CAF50;
        }

        /* Estilo para el select */
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
            background-color: white;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #4CAF50;
        }

        /* Estilo para el botón */
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            background-color: #388e3c;
        }

        /* Estilo para mensajes */
        .message {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            font-size: 16px;
        }

        .success {
            background-color: #4CAF50;
            color: white;
        }

        .error {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Actualizar Usuario</h3>

        <!-- Formulario para actualizar -->
        <label for="id1">ID del Usuario:</label>
        <input type="number" id="id1" placeholder="Introduce el ID del usuario" required>

        <label for="opcion1">Seleccione la opción:</label>
        <select id="opcion1">
            <option value="nom">Nombre</option>
            <option value="pwd">Contraseña</option>
            <option value="email">Email</option>
        </select>

        <label for="newValue1">Nuevo Valor:</label>
        <input type="text" id="newValue1" placeholder="Introduce el nuevo valor" required>

        <button id="boton">Enviar</button>

        <!-- Mensajes de éxito o error -->
        <div id="message" class="message"></div>
    </div>
    
    <script>
        boton.addEventListener("click", function() {
            const id = id1.value;
            const opcion = opcion1.value;
            const newValue = newValue1.value;
            
            fetch("/usuario", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({id, opcion, newValue
                })
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error("Error:", error));
        });
    </script>
</body>
</html>
