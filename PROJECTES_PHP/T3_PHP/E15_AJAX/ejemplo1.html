<!DOCTYPE html>
<html lang="en">
<body>
    <h2>Creating an Objet from a JSON String</h2>
    <p id="demo"></p>
    <script>
        const txt = '{"name":"John", "age":30, "city":"New York"}';
        const obj = JSON.parse(txt);
        demo.innerHTML = obj.name + ", " + obj.age + ", " + obj.city;
    </script>
</body>
</html>
