<!DOCTYPE html>
<html>
<head>
    <title>Hora en el servidor</title>
    <meta charset="UTF-8">
    <script>
        function loadDoc() {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    hora.innerHTML = "Hora Actual en el servidor: " + this.responseText;
                }
            };
            xhttp.open("GET", "ajax_horaServidor.php", false);
            xhttp.send();
            return false;
        }
        setInterval(loadDoc, 5000);
    </script>
</head>
<body>
    <h2>Hora en servidor</h2>
    <section id="hora">Atento a la hora</section>
</body>
</html>
