<!DOCTYPE html>
<html>
<body>
    <h2>Parsing a JSON Associative Array</h2>
    <p>Displaying multiple user details.</p>
    <p id="demo"></p>

    <script>
        const jsonText = `[
            {"name": "John", "age": 30, "city": "New York"}, 
            {"name": "John2", "age": 40, "city": "Illinois"}
        ]`;

        const people = JSON.parse(jsonText);

        let salida = "";
        for (let i = 0; i < people.length; i++) {
            salida += `Name: ${people[i].name},<br>
                    Age: ${people[i].age},<br>
                    City: ${people[i].city}<br><br>`;
        }

        demo.innerHTML = salida;
    </script>

</body>
</html>
